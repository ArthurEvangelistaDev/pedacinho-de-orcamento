spring.application.name=pedacinho-de-orcamento
server.address=127.0.0.1
server.port=${APP_PORT:8080}
spring.datasource.url=${APP_DB_URL:jdbc:mysql://127.0.0.1:3306/pedacinho?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${APP_DB_USER:pedacinho}
spring.datasource.password=${APP_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
